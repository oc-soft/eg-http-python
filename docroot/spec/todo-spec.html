<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width; initial-scale=1.0" />
    <meta charset="utf-8" /> 
    <title>todoリスト仕様</title>
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.mjs';
      const darkMode = window.matchMedia(
        '(prefers-color-scheme: dark)').matches;
      mermaid.initialize({
        securityLevel: 'loose',
        startOnLoad: false,
        theme: darkMode ? 'neo-dark' : 'neo',
        darkMode,
        themeVariables: {
          treeView: {
            labelColor: darkMode ? "rgba(255, 255, 255, 0.87)" : "#213547" 
          }
        }
      });

      window.mermaid = mermaid
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
    <script src="todo-spec.js"></script>
    <link href="todo-spec.css" rel="stylesheet"/>
  </head>
  <body>
    <div id="spec"></div>
  </body>
<!-- vi: se ts=2 sw=2 et: -->
</html>
